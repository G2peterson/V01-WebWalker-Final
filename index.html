<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWalker V01</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="logo-area">
        <img src="assets/webwalker-logo.png" alt="WebWalker Logo" class="logo">
    </div>

    <div class="contact-area">
        <a href="sms:+13173858672">Text</a>
        <a href="tel:+13173858672">Phone</a>
        <a href="mailto:webwalker.world@gmail.com">Email</a>
    </div>

    <div class="burger">☰</div>
</header>

<main>

    <section class="lane" id="lane-cyber"></section>

    <section class="card" onclick="moveWeaver('lane-cyber','cyber')">
        <h2>Cybersecurity</h2>
        <p>Protect systems, accounts, and data.</p>
    </section>

    <section class="lane" id="lane-service"></section>

    <section class="card" onclick="moveWeaver('lane-service','service')">
        <h2>Cyber Service Businesses</h2>
        <p>Tools, automation, and digital operations.</p>
    </section>

    <section class="lane" id="lane-future"></section>

    <section class="card" onclick="moveWeaver('lane-future','future')">
        <h2>Future Technology</h2>
        <p>AI, authentication, and emerging systems.</p>
    </section>

</main>

<div id="weaver">
    <img src="assets/weaver-character.png" alt="Weaver">
</div>

<div id="weaver-panel">
    <div class="panel-buttons">
        <button id="fyi-btn">FYI</button>
        <button id="faq-btn">FAQ</button>
    </div>

    <div id="panel-content"></div>

    <div class="search-row">
        <input
            type="text"
            placeholder="Ask about this section..."
        >
        <button>🔍</button>
    </div>
</div>

<script src="weaver.js"></script>

</body>
</html>
